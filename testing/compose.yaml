# The servers this plugin's tests run against.
#
# Redis 7.4, with the password `spelaion` for its default user, published on 127.0.0.1:16380
# (SPELAION_TEST_REDIS).
#
# Valkey 8, Redis's open fork, reached through this plugin as a kind of Redis connection
# (SpelaionDB's ADR-056), on 127.0.0.1:16381 (SPELAION_TEST_VALKEY), same password.
name: spelaiondb-plugin-redis-test

services:
  redis:
    image: redis:7.4
    command: ["redis-server", "--requirepass", "spelaion"]
    ports:
      - "127.0.0.1:16380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "spelaion", "--no-auth-warning", "ping"]
      interval: 2s
      timeout: 5s
      retries: 60

  valkey:
    image: valkey/valkey:8
    command: ["valkey-server", "--requirepass", "spelaion"]
    ports:
      - "127.0.0.1:16381:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "spelaion", "--no-auth-warning", "ping"]
      interval: 2s
      timeout: 5s
      retries: 60
