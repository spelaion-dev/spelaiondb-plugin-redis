# What SpelaionDB's `plugins.toml` says of this plugin besides its builds. The release notes
# are written from here, and `tests/conformance.rs` checks it against what the program says.

# The plugin protocol this plugin speaks: 1.1, for requests (SpelaionDB's ADR-056).
protocol = "1.1"
# The engines it serves, by the name SpelaionDB's configuration uses (`engine = "redis"`).
# Valkey is reached as a Redis connection.
engines = ["redis"]
# The lowest SpelaionDB it works with.
min_app = "0.10.0"
